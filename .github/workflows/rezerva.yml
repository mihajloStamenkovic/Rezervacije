name: Nocna rezerva

# Nightly backup of the reservation book, and the thing that keeps the
# Supabase project awake.
#
# Two jobs in one, both load-bearing:
#
#   1. **Backup.** Deleting a reservation is permanent — no status column, no
#      undo, no recycle bin (SPEC §8). This dump is the only way back.
#   2. **Keep-alive.** Supabase pauses a free project after 7 days with no
#      activity. A quiet week in winter would otherwise take the app offline
#      until somebody noticed and unpaused it. A daily query counts as
#      activity, so the backup pays for itself twice.
#
# Backups live on the orphan branch `rezerve`, which shares no history with
# `main`. Cloning the code therefore never drags the backups along, and they
# never expire the way build artifacts do.
#
# Note there is no `actions/checkout`: this job does not need the source code,
# only `pg_dump` and somewhere to push. The backup branch is assembled in its
# own throwaway repository under $RUNNER_TEMP, which is also what makes the
# very first run — when `rezerve` does not exist yet — an ordinary case rather
# than a failure to recover from.

on:
  schedule:
    # 01:30 UTC — 02:30 in Belgrade in winter, 03:30 in summer. Deliberately
    # in the small hours: nobody is booking a van then, so the dump is taken
    # against a quiet database.
    - cron: "30 1 * * *"
  # So a backup can be taken by hand before anything risky.
  workflow_dispatch:

concurrency:
  group: rezerva
  cancel-in-progress: false

jobs:
  rezerva:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Instaliraj pg_dump 17
        # The runner ships client 16; the Supabase server is 17.6, and pg_dump
        # refuses to dump from a server newer than itself. Pin the major
        # version to the server's, not to whatever the image happens to have.
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

          # Installing 17 is not enough. `/usr/bin/pg_dump` is
          # postgresql-common's `pg_wrapper`, which picks a version of its own
          # accord and on this runner kept choosing the pre-installed 16 — which
          # then aborts with "server version mismatch" against a 17.6 server.
          # Address the real binary instead of the wrapper, and hand its
          # directory to the next step so nothing can pick up the wrong one.
          PGBIN=/usr/lib/postgresql/17/bin
          if [ ! -x "$PGBIN/pg_dump" ]; then
            echo "::error::$PGBIN/pg_dump ne postoji — instalacija klijenta 17 nije uspela."
            ls -la /usr/lib/postgresql/ || true
            exit 1
          fi
          echo "PGBIN=$PGBIN" >> "$GITHUB_ENV"

          # Refuse to continue on anything but 17, rather than discovering it
          # halfway through a dump.
          VERZIJA=$("$PGBIN/pg_dump" --version | grep -oE "[0-9]+" | head -1)
          echo "wrapper: $(pg_dump --version)"
          echo "stvarni: $("$PGBIN/pg_dump" --version)"
          if [ "$VERZIJA" != "17" ]; then
            echo "::error::Ocekivan pg_dump 17, dobijen $VERZIJA."
            exit 1
          fi

      - name: Napravi rezervu
        env:
          # Session pooler, port 5432. The transaction pooler on 6543 cannot
          # hold the session state pg_dump needs.
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DIRECT_URL:-}" ]; then
            echo "::error::Tajna DIRECT_URL nije podesena (Settings > Secrets and variables > Actions)."
            exit 1
          fi

          DAN=$(date -u +%Y-%m-%d)
          GODINA=$(date -u +%Y)
          IZLAZ="$RUNNER_TEMP/izlaz"
          mkdir -p "$IZLAZ/dump/$GODINA" "$IZLAZ/csv"
          echo "DAN=$DAN" >> "$GITHUB_ENV"
          echo "GODINA=$GODINA" >> "$GITHUB_ENV"
          echo "IZLAZ=$IZLAZ" >> "$GITHUB_ENV"

          echo "--- pg_dump ---"
          # Only the `public` schema: that is the whole app. `auth` is
          # Supabase's own and holds password hashes — it is deliberately NOT
          # dumped, so this backup can never leak credentials.
          #
          # No --clean and no --if-exists: a dump that cannot DROP anything
          # cannot destroy a live database if it is ever run at the wrong one
          # by mistake. Restores go into an empty database (see RUNBOOK.md).
          "$PGBIN/pg_dump" "$DIRECT_URL" \
            --schema=public \
            --no-owner --no-privileges \
            --quote-all-identifiers \
            -f "$IZLAZ/$DAN.sql"

          echo "--- csv ---"
          # A copy a human can read without any tooling. GitHub renders CSV as
          # a table in the browser, so the owner can open the booking book on
          # a phone even if everything else is on fire.
          "$PGBIN/psql" "$DIRECT_URL" -v ON_ERROR_STOP=1 -q -c "\\copy ( \
              SELECT r.ime, r.telefon, r.broj_putnika, \
                     r.datum_polaska, o.drzava AS odlaziste_drzava, o.grad AS odlaziste, \
                     r.datum_povratka, p.drzava AS povratiste_drzava, p.grad AS povratiste, \
                     pr.ime AS uneo \
              FROM reservations r \
              JOIN destinacije o ON o.id = r.destinacija_id \
              JOIN destinacije p ON p.id = r.destinacija_povratka_id \
              JOIN profiles pr ON pr.id = r.kreirao \
              ORDER BY r.datum_polaska \
            ) TO '$IZLAZ/csv/rezervacije-najnovije.csv' WITH CSV HEADER"
          cp "$IZLAZ/csv/rezervacije-najnovije.csv" "$IZLAZ/csv/$DAN-rezervacije.csv"

          echo "--- provera ---"
          # A backup that silently contains nothing is worse than no backup,
          # because it looks like success. Refuse to commit one.
          TABELA=$(grep -c '^CREATE TABLE' "$IZLAZ/$DAN.sql" || true)
          DEST=$(grep -c '^COPY "public"."destinacije"' "$IZLAZ/$DAN.sql" || true)
          VELICINA=$(wc -c < "$IZLAZ/$DAN.sql")
          REZ=$(($(wc -l < "$IZLAZ/csv/rezervacije-najnovije.csv") - 1))
          echo "tabela=$TABELA destinacije_blok=$DEST velicina=${VELICINA}B rezervacija=$REZ"
          if [ "$TABELA" -lt 4 ] || [ "$DEST" -lt 1 ] || [ "$VELICINA" -lt 2000 ]; then
            echo "::error::Rezerva izgleda prazna ili nepotpuna — nije sacuvana."
            exit 1
          fi

          gzip -9 "$IZLAZ/$DAN.sql"
          mv "$IZLAZ/$DAN.sql.gz" "$IZLAZ/dump/$GODINA/$DAN.sql.gz"
          echo "::notice::Rezerva $DAN — $REZ rezervacija, $(wc -c < "$IZLAZ/dump/$GODINA/$DAN.sql.gz")B stisnuto."

      - name: Sacuvaj na granu rezerve
        run: |
          set -euo pipefail
          RADNI="$RUNNER_TEMP/rezerve"
          rm -rf "$RADNI"
          # `-b rezerve` names the unborn branch up front, so the first ever
          # run needs no orphan gymnastics.
          git init -q -b rezerve "$RADNI"
          cd "$RADNI"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

          if git ls-remote --exit-code --heads origin rezerve >/dev/null 2>&1; then
            echo "Grana rezerve postoji — dopisujem."
            git fetch -q --depth=1 origin rezerve
            git reset -q --hard FETCH_HEAD
          else
            echo "Grana rezerve ne postoji — pravim je prvi put."
          fi

          cp -r "$IZLAZ/dump" "$IZLAZ/csv" .
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::Nema promena — baza je identicna prethodnoj rezervi."
            exit 0
          fi
          git commit -q -m "Rezerva $DAN"
          git push -q origin rezerve
          echo "::notice::Rezerva $DAN sacuvana na granu rezerve."
